name: CD Deploy Pipeline

on:
  push:
    branches: [ main ]
  workflow_run:
    workflows: ["CI Pipeline"]
    branches: [ main ]
    types:
      - completed

jobs:
  deploy-backend:
    name: Build, Push GHCR & Deploy to Render
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/server
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build & Push Server Image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Render Backend Deploy Hook
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        run: |
          echo "Triggering Render Web Service deployment..."
          curl -s -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Render deploy hook triggered successfully."

      - name: Poll Backend Readiness (/readyz)
        if: ${{ secrets.RENDER_BACKEND_URL != '' }}
        run: |
          BACKEND_URL="${{ secrets.RENDER_BACKEND_URL }}"
          READYZ_URL="${BACKEND_URL%/}/readyz"
          echo "Polling ${READYZ_URL} for up to 180 seconds..."
          
          MAX_RETRIES=36
          RETRY_COUNT=0
          
          until curl -s -f "$READYZ_URL" | grep -q '"status":"ok"'; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
              echo "FAILED: Backend did not return 200 OK on /readyz within 3 minutes!"
              exit 1
            fi
            echo "Waiting for backend restart/deploy... (${RETRY_COUNT}/${MAX_RETRIES})"
            sleep 5
          done

          echo "Backend is live and healthy on Render!"

      - name: Execute Live Post-Deploy Smoke Test
        if: ${{ secrets.RENDER_BACKEND_URL != '' }}
        run: |
          npm ci --prefix server
          node scripts/prod_smoke.js "${{ secrets.RENDER_BACKEND_URL }}"

      - name: Verify Vercel Frontend WS Alignment
        run: |
          echo "Verifying VITE_WS_URL formatting check..."
          node -e '
            const wsUrl = process.env.VITE_WS_URL || "wss://liveloom-server.onrender.com/ws";
            if (!wsUrl.startsWith("ws://") && !wsUrl.startsWith("wss://")) {
              console.error("Invalid VITE_WS_URL format:", wsUrl);
              process.exit(1);
            }
            console.log("Frontend WS URL target is valid:", wsUrl);
          '
