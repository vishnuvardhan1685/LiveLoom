name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: 1. Lint, Unit Tests & Bundle Budget
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Server Dependencies
        run: npm ci --prefix server

      - name: Install Client Dependencies
        run: npm ci --prefix client

      - name: Lint Client and Server
        run: |
          npm run lint --prefix client --if-present
          npm run lint --prefix server --if-present

      - name: Run Unit & Integration Tests
        run: npm test

      - name: Build Client SPA
        run: npm run build --prefix client

      - name: Verify Client Bundle Size Budget (<500 KB Gzipped)
        run: npm run check:bundle

  docker-smoke-test:
    name: 2. Docker Build & Quick Benchmark Smoke Test
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Server Image (Buildx Cache)
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          load: true
          tags: liveloom-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start Containerized Stack
        run: docker compose up -d

      - name: Wait for Server Readiness (/readyz)
        run: |
          echo "Waiting for http://localhost/readyz..."
          for i in {1..30}; do
            if curl -sf http://localhost/readyz; then
              echo "Server is ready!"
              exit 0
            fi
            sleep 2
          done
          echo "Server failed to become ready within 60s!"
          docker compose logs
          exit 1

      - name: Run Quick Benchmarks (Tests A, C, K)
        run: |
          npm ci --prefix benchmarks
          API_BASE=http://localhost WS_BASE=ws://localhost/ws node scripts/run_quick_benchmarks.js

      - name: Upload Docker Container Logs on Failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-container-logs
          path: |
            server.log
          retention-days: 7

      - name: Shutdown Containerized Stack
        if: always()
        run: docker compose down -v

  security-and-audit:
    name: 3. Security Scanning & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit Production Dependencies (Warn Only)
        continue-on-error: true
        run: |
          npm audit --prefix server --omit=dev || true
          npm audit --prefix client --omit=dev || true

      - name: Secret Scanning (Gitleaks)
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
