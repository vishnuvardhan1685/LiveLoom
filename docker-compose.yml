services:
  mongo:
    image: mongo:7.0
    restart: always
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal_net

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal_net

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: always
    environment:
      PORT: 4000
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/liveloom
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_jwt_secret_liveloom_secure_key_change_me
      WS_TICKET_SECRET: dev_ws_ticket_secret_liveloom_secure_key_change_me
      CLIENT_ORIGINS: "*"
      LOG_LEVEL: info
      TRUST_PROXY: "true"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal_net

  server-replica:
    profiles:
      - scale
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: always
    environment:
      PORT: 4000
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/liveloom
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_jwt_secret_liveloom_secure_key_change_me
      WS_TICKET_SECRET: dev_ws_ticket_secret_liveloom_secure_key_change_me
      CLIENT_ORIGINS: "*"
      LOG_LEVEL: info
      TRUST_PROXY: "true"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal_net

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server
    networks:
      - internal_net

networks:
  internal_net:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
